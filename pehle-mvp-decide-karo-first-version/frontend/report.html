<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Report Item | HostelFind</title><link rel="stylesheet" href="css/style.css"></head><body><header><a class="brand" href="index.html">Hostel<span>Find</span></a><button class="menu">☰</button><nav><a href="index.html">Home</a><a href="report.html?type=LOST">Report Lost</a><a href="report.html?type=FOUND">Report Found</a><a href="items.html">Browse Items</a><a href="login.html">Login</a></nav></header><main class="page narrow"><p class="eyebrow">SUBMIT A REPORT</p><h1 id="report-title">Report an item</h1><p class="muted">Your report will be visible after an admin review. Avoid sharing private details of sensitive items.</p><form class="form-card" id="report-form"><div class="form-grid"><label>Item name<input required name="title" placeholder="e.g. Black water bottle"></label><label>Category<select required name="category"><option value="">Choose category</option><option>Electronics</option><option>ID Cards</option><option>Keys</option><option>Clothes</option><option>Books</option><option>Wallet</option><option>Accessories</option><option>Other</option></select></label></div><label>Description<textarea required name="description" placeholder="Describe colour, brand, or other non-sensitive details"></textarea><small>For wallets, IDs, phones and keys: don't post exact contents, ID number, password, or serial number.</small></label><div class="form-grid"><label>Location<input required name="location" placeholder="e.g. Library, 2nd floor"></label><label>Date & time<input required type="datetime-local" name="date"></label></div><div class="form-grid"><label>Photo URL (optional)<input type="url" name="imageUrl" placeholder="https://..."></label><label>Contact method<input required name="contactMethod" placeholder="College email / hostel office"></label></div><button class="btn primary">Submit for review</button></form></main><footer>HostelFind · Built for a more helpful hostel community</footer><script src="js/app.js"></script></body></html>
